name: Continuous Integration

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - "feature/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==============================
  # BACKEND TESTS
  # ==============================
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=moderate

      - name: Run Backend Tests
        run: npm test

      - name: Check JavaScript Syntax
        run: node --check server.js

      - name: Verify bcrypt
        run: node -e "require('bcrypt'); console.log('bcrypt loaded successfully')"

  # ==============================
  # FRONTEND QUALITY CHECKS
  # ==============================
  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=moderate

      - name: Run ESLint
        run: npm run lint

      - name: Build Frontend
        run: npm run build

  # ==============================
  # TERRAFORM VALIDATION
  # ==============================
  terraform:
    name: Terraform Quality Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.6

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.66.0

      - name: Initialize TFLint Plugins
        run: tflint --config="$GITHUB_WORKSPACE/tflint.hcl" --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint --recursive --config="$GITHUB_WORKSPACE/tflint.hcl"

  # ==============================
  # DOCKER IMAGE BUILDS
  # ==============================
  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Build Frontend Image
        run: |
          docker build --pull \
            --tag "mbeautycakes-frontend:ci-${GITHUB_SHA}" \
            ./frontend

      - name: Build Backend Image
        run: |
          docker build --pull \
            --tag "mbeautycakes-backend:ci-${GITHUB_SHA}" \
            ./backend